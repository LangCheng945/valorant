<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>特務幣｜快速下單</title>
  <style>
    :root {
      --bg: #111315;
      --panel: #181b1f;
      --panel-2: #1d2126;
      --border: #2b3036;
      --border-hover: #3a4149;
      --text: #f1f3f5;
      --muted: #9299a2;
      --accent: #f97316;
      --accent-hover: #ea580c;
      --input: #121519;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   "Noto Sans TC", Arial, sans-serif;
      line-height: 1.5;
    }

    .page {
      min-height: 100vh;
      padding: 48px 20px;
    }

    .container {
      width: min(1080px, 100%);
      margin: 0 auto;
    }

    header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 28px;
    }

    .brand {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .brand h1 {
      margin: 0;
      font-size: 25px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .brand p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }

    .content {
      display: grid;
      grid-template-columns: minmax(0, 1.55fr) minmax(300px, .8fr);
      gap: 20px;
      align-items: start;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
    }

    .section + .section {
      margin-top: 28px;
      padding-top: 28px;
      border-top: 1px solid var(--border);
    }

    .section-title {
      margin: 0 0 16px;
      font-size: 16px;
      font-weight: 650;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .product {
      appearance: none;
      width: 100%;
      text-align: left;
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 17px 16px;
      cursor: pointer;
      transition: border-color .15s ease, background .15s ease;
    }

    .product:hover {
      border-color: var(--border-hover);
      background: #20242a;
    }

    .product.selected {
      border-color: var(--accent);
      background: #211a15;
    }

    .vp {
      display: block;
      font-size: 17px;
      font-weight: 650;
    }

    .price {
      display: block;
      margin-top: 5px;
      color: #b9bec5;
      font-size: 14px;
    }

    .product.selected .price {
      color: #ffb184;
    }

    .fields {
      display: grid;
      gap: 16px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 13px;
      font-weight: 600;
      color: #d9dde1;
    }

    input {
      width: 100%;
      height: 44px;
      padding: 0 13px;
      border: 1px solid var(--border);
      border-radius: 8px;
      outline: none;
      background: var(--input);
      color: var(--text);
      font: inherit;
      transition: border-color .15s ease, box-shadow .15s ease;
    }

    input::placeholder {
      color: #555d66;
    }

    input:focus {
      border-color: #6b737d;
      box-shadow: 0 0 0 2px rgba(249, 115, 22, .10);
    }

    .hint {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .promo-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
    }

    button {
      font: inherit;
    }

    .secondary {
      height: 44px;
      padding: 0 17px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #252a30;
      color: var(--text);
      cursor: pointer;
      font-weight: 600;
    }

    .secondary:hover {
      background: #2c3239;
    }

    .discount {
      display: none;
      margin-top: 8px;
      color: #8fc99d;
      font-size: 12px;
    }

    .summary {
      position: sticky;
      top: 24px;
    }

    .summary-title {
      margin: 0 0 22px;
      font-size: 16px;
      font-weight: 650;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      padding: 11px 0;
      color: #b7bdc5;
      font-size: 14px;
    }

    .summary-row strong {
      color: var(--text);
      font-weight: 600;
      text-align: right;
    }

    .summary-row.discount-row {
      display: none;
      color: #8fc99d;
    }

    .summary-row.discount-row strong {
      color: #8fc99d;
    }

    .divider {
      height: 1px;
      background: var(--border);
      margin: 8px 0;
    }

    .total {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 16px;
      padding-top: 17px;
    }

    .total span {
      color: #b7bdc5;
      font-size: 14px;
    }

    .total strong {
      font-size: 25px;
      letter-spacing: -0.02em;
    }

    .submit {
      width: 100%;
      height: 46px;
      margin-top: 24px;
      border: 0;
      border-radius: 8px;
      background: var(--accent);
      color: white;
      cursor: pointer;
      font-weight: 700;
      transition: background .15s ease;
    }

    .submit:hover { background: var(--accent-hover); }
    .submit:disabled { background: #3a3f45; color: #777e86; cursor: not-allowed; }

    .status {
      min-height: 18px;
      margin-top: 12px;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }

    @media (max-width: 780px) {
      .page { padding: 24px 14px; }
      header { margin-bottom: 20px; }
      .content { grid-template-columns: 1fr; }
      .summary { position: static; }
      .products { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 430px) {
      .panel { padding: 18px; }
      .products { grid-template-columns: 1fr 1fr; gap: 8px; }
      .product { padding: 14px; }
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="container">
      <header>
        <div class="brand">
          <h1>特務幣</h1>
          <p>快速下單系統</p>
        </div>
      </header>

      <div class="content">
        <main class="panel">
          <section class="section">
            <h2 class="section-title">選擇儲值面額</h2>

            <div class="products" id="products"></div>
          </section>

          <section class="section">
            <h2 class="section-title">帳號資訊</h2>

            <div class="fields">
              <div>
                <label for="riotUsername">Riot 帳號</label>
                <input id="riotUsername" type="text" autocomplete="username">
              </div>

              <div>
                <label for="riotPassword">Riot 密碼</label>
                <input id="riotPassword" type="password" autocomplete="current-password">
                <p class="hint">僅在實際代充流程需要時填寫。</p>
              </div>

              <div>
                <label for="valorantId">特戰 ID</label>
                <input id="valorantId" type="text">
                <p class="hint">格式：名稱#標籤</p>
              </div>

              <div>
                <label for="promoCode">優惠碼 <span style="font-weight:400;color:#6f7780;">（選填）</span></label>
                <div class="promo-row">
                  <input id="promoCode" type="text" autocomplete="off">
                  <button class="secondary" type="button" id="applyPromo">套用</button>
                </div>
                <div class="discount" id="discountMessage"></div>
              </div>
            </div>
          </section>
        </main>

        <aside class="panel summary">
          <h2 class="summary-title">訂單摘要</h2>

          <div class="summary-row">
            <span>儲值面額</span>
            <strong id="summaryVp">—</strong>
          </div>

          <div class="summary-row">
            <span>原始金額</span>
            <strong id="summaryOriginal">—</strong>
          </div>

          <div class="summary-row discount-row" id="discountRow">
            <span>優惠</span>
            <strong id="summaryDiscount">—</strong>
          </div>

          <div class="divider"></div>

          <div class="total">
            <span>應付金額</span>
            <strong id="summaryTotal">NT$ 0</strong>
          </div>

          <button class="submit" id="submitOrder" type="button" disabled>
            確認並下單
          </button>

          <div class="status" id="status"></div>
        </aside>
      </div>
    </div>
  </div>

  <script>
    const products = [
      { vp: 475, price: 150 },
      { vp: 1000, price: 300 },
      { vp: 2050, price: 600 },
      { vp: 3650, price: 1080 },
      { vp: 5350, price: 1450 },
      { vp: 11000, price: 2780 }
    ];

    let selected = null;
    let discountApplied = false;

    const productsEl = document.getElementById("products");
    const summaryVp = document.getElementById("summaryVp");
    const summaryOriginal = document.getElementById("summaryOriginal");
    const summaryTotal = document.getElementById("summaryTotal");
    const discountRow = document.getElementById("discountRow");
    const summaryDiscount = document.getElementById("summaryDiscount");
    const discountMessage = document.getElementById("discountMessage");
    const submitOrder = document.getElementById("submitOrder");
    const status = document.getElementById("status");

    function renderProducts() {
      productsEl.innerHTML = products.map(item => `
        <button class="product ${selected?.vp === item.vp ? "selected" : ""}"
                type="button"
                data-vp="${item.vp}">
          <span class="vp">${item.vp.toLocaleString()} VP</span>
          <span class="price">NT$ ${item.price.toLocaleString()}</span>
        </button>
      `).join("");

      productsEl.querySelectorAll(".product").forEach(button => {
        button.addEventListener("click", () => {
          selected = products.find(item => item.vp === Number(button.dataset.vp));
          renderProducts();
          updateSummary();
        });
      });
    }

    function getFinalPrice() {
      if (!selected) return 0;

      if (!discountApplied) return selected.price;

      if (selected.vp >= 11000) {
        return selected.price - 50;
      }

      return Math.round(selected.price * 0.95);
    }

    function updateSummary() {
      const finalPrice = getFinalPrice();

      summaryVp.textContent = selected ? `${selected.vp.toLocaleString()} VP` : "—";
      summaryOriginal.textContent = selected ? `NT$ ${selected.price.toLocaleString()}` : "—";
      summaryTotal.textContent = `NT$ ${finalPrice.toLocaleString()}`;
      submitOrder.disabled = !selected;

      if (discountApplied && selected) {
        const discount = selected.price - finalPrice;
        discountRow.style.display = "flex";
        summaryDiscount.textContent = `-NT$ ${discount.toLocaleString()}`;
        discountMessage.style.display = "block";
        discountMessage.textContent =
          selected.vp >= 11000 ? "優惠已套用：現折 NT$ 50" : "優惠已套用：95 折";
      } else {
        discountRow.style.display = "none";
        discountMessage.style.display = "none";
      }
    }

    document.getElementById("applyPromo").addEventListener("click", () => {
      const code = document.getElementById("promoCode").value.trim().toUpperCase();

      if (code === "OPEN95") {
        discountApplied = true;
        status.textContent = "優惠碼已套用";
      } else if (!code) {
        discountApplied = false;
        status.textContent = "";
      } else {
        discountApplied = false;
        status.textContent = "優惠碼無效";
      }

      updateSummary();
    });

    submitOrder.addEventListener("click", () => {
      if (!selected) return;

      status.textContent =
        `已選擇 ${selected.vp.toLocaleString()} VP，應付 NT$ ${getFinalPrice().toLocaleString()}。`;
    });

    renderProducts();
    updateSummary();
  </script>
</body>
</html>
