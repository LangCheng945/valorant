<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>特務幣｜快速下單</title>
  <style>
    /* VALORANT 風格視覺：背景圖僅作為氛圍層，內容仍保持可讀性 */
    :root {
      --bg: #070b0f;
      --panel: rgba(8, 14, 20, .91);
      --panel-soft: rgba(18, 27, 36, .82);
      --border: #263542;
      --border-hot: #ff4655;
      --text: #f4f5f6;
      --muted: #8d98a3;
      --accent: #ff4655;
      --accent-dark: #d92e3e;
      --input: rgba(15, 24, 32, .92);
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      color: var(--text);
      background:
        radial-gradient(circle at 82% 28%, rgba(255,70,85,.13), transparent 28%),
        radial-gradient(circle at 15% 15%, rgba(255,70,85,.09), transparent 25%),
        linear-gradient(135deg, #05080b 0%, #0a1016 48%, #080b0f 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   "Noto Sans TC", Arial, sans-serif;
      line-height: 1.5;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .9;
      background:
        linear-gradient(125deg, transparent 0 9%, rgba(255,70,85,.16) 9.1% 13%, transparent 13.1% 100%),
        linear-gradient(305deg, transparent 0 77%, rgba(255,70,85,.10) 77.1% 82%, transparent 82.1% 100%),
        linear-gradient(135deg, transparent 0 52%, rgba(255,255,255,.018) 52.1% 52.25%, transparent 52.35% 100%);
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(90deg, transparent 0 8%, rgba(255,70,85,.07) 8.1% 8.2%, transparent 8.3% 91.7%, rgba(255,70,85,.05) 91.8% 91.9%, transparent 92%),
        repeating-linear-gradient(135deg, transparent 0 100px, rgba(255,255,255,.012) 100px 101px);
      mix-blend-mode: screen;
    }

    .page {
      min-height: 100vh;
      padding: 42px 22px 60px;
    }

    .container {
      width: min(1120px, 100%);
      margin: 0 auto;
    }

    header {
      position: relative;
      display: flex;
      justify-content: center;
      text-align: center;
      margin-bottom: 24px;
    }

    .brand {
      position: relative;
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: 0 55px;
    }

    .brand::before,
    .brand::after {
      content: "";
      position: absolute;
      top: 50%;
      width: 46px;
      height: 1px;
      background: var(--accent);
    }

    .brand::before { right: 100%; }
    .brand::after { left: 100%; }

    .eyebrow {
      margin: 0;
      color: var(--accent);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .42em;
    }

    .brand h1 {
      margin: 0;
      font-size: clamp(30px, 4vw, 44px);
      line-height: 1.05;
      font-weight: 800;
      letter-spacing: .08em;
      text-shadow: 0 0 24px rgba(255,70,85,.16);
    }

    .brand p {
      margin: 5px 0 0;
      color: #9ba4ad;
      font-size: 13px;
      letter-spacing: .28em;
    }

    .content {
      display: grid;
      grid-template-columns: minmax(0, 1.7fr) minmax(310px, .7fr);
      gap: 18px;
      align-items: start;
    }

    .panel {
      position: relative;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 4px;
      box-shadow: 0 20px 70px rgba(0,0,0,.42);
      backdrop-filter: blur(10px);
    }

    .panel::before {
      content: "";
      position: absolute;
      left: -1px;
      top: 0;
      bottom: 0;
      width: 3px;
      background: linear-gradient(var(--accent), transparent 70%);
      opacity: .9;
    }

    main.panel { padding: 25px 26px 28px; }
    aside.panel { padding: 25px; }

    .section + .section {
      margin-top: 28px;
      padding-top: 27px;
      border-top: 1px solid #26323d;
    }

    .section-title,
    .summary-title {
      position: relative;
      margin: 0 0 17px;
      padding-left: 13px;
      font-size: 17px;
      font-weight: 750;
      letter-spacing: .03em;
    }

    .section-title::before,
    .summary-title::before {
      content: "";
      position: absolute;
      left: 0;
      top: 4px;
      bottom: 4px;
      width: 3px;
      background: var(--accent);
    }

    .products {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 11px;
    }

    .product {
      position: relative;
      overflow: hidden;
      background:
        linear-gradient(135deg, rgba(27,39,50,.82), rgba(11,18,25,.92));
      color: var(--text);
      border: 1px solid #2b3a47;
      border-radius: 3px;
      padding: 15px;
      transition: .16s ease;
    }

    .product::after {
      content: "";
      position: absolute;
      right: -28px;
      bottom: -40px;
      width: 95px;
      height: 95px;
      transform: rotate(45deg);
      border: 1px solid rgba(255,255,255,.05);
    }

    .product:hover {
      border-color: #53616d;
      transform: translateY(-1px);
    }

    .product.selected {
      border-color: var(--accent);
      background:
        linear-gradient(135deg, rgba(75,24,31,.82), rgba(16,20,25,.94));
      box-shadow: inset 0 0 0 1px rgba(255,70,85,.12);
    }

    .product.selected::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 3px;
      background: var(--accent);
    }

    .vp {
      display: block;
      font-size: 17px;
      font-weight: 750;
      letter-spacing: .02em;
    }

    .price {
      display: block;
      margin-top: 6px;
      color: #b7c0c8;
      font-size: 14px;
    }

    .product.selected .price {
      color: #ff8993;
    }

    .quantity {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 13px;
      padding-top: 11px;
      border-top: 1px solid #293743;
    }

    .qty-label {
      color: #707c87;
      font-size: 11px;
    }

    .qty-controls {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .qty-btn {
      width: 27px;
      height: 27px;
      border: 1px solid #3a4a58;
      border-radius: 3px;
      background: #1b252e;
      color: #dfe4e8;
      cursor: pointer;
      font-size: 16px;
      line-height: 1;
    }

    .qty-btn:hover {
      border-color: #687887;
      background: #24313c;
    }

    .qty-value {
      min-width: 23px;
      text-align: center;
      font-size: 13px;
      font-weight: 700;
    }

    .cart-total {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 18px;
      padding: 14px 15px;
      border: 1px solid #293743;
      background: rgba(10,16,22,.7);
    }

    .cart-total-item {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .cart-total-label {
      color: #77838e;
      font-size: 11px;
    }

    .cart-total-value {
      font-size: 18px;
      font-weight: 750;
    }

    .cart-total-value.accent {
      color: var(--accent);
    }

    .fields {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 17px;
    }

    .fields > div:nth-child(3),
    .fields > div:nth-child(4) {
      grid-column: 1 / -1;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 13px;
      font-weight: 650;
      color: #d6dce1;
    }

    input {
      width: 100%;
      height: 44px;
      padding: 0 13px;
      border: 1px solid #30404e;
      border-radius: 3px;
      outline: none;
      background: var(--input);
      color: var(--text);
      font: inherit;
      transition: border-color .15s ease, box-shadow .15s ease;
    }

    input::placeholder { color: #59636d; }

    input:focus {
      border-color: #687887;
      box-shadow: 0 0 0 1px rgba(255,70,85,.22);
    }

    .hint {
      margin: 6px 0 0;
      color: #68747f;
      font-size: 11px;
    }

    .promo-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 9px;
    }

    .secondary {
      height: 44px;
      padding: 0 18px;
      border: 1px solid #40505e;
      border-radius: 3px;
      background: #202b35;
      color: var(--text);
      cursor: pointer;
      font-weight: 650;
    }

    .secondary:hover { border-color: #647583; }

    .discount {
      display: none;
      margin-top: 7px;
      color: #8fcb9c;
      font-size: 11px;
    }

    .summary {
      position: sticky;
      top: 22px;
    }

    .summary-title { margin-bottom: 23px; }

    .summary-row {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      padding: 11px 0;
      color: #8f9aa5;
      font-size: 13px;
    }

    .summary-row strong {
      color: #e8ebee;
      font-weight: 650;
      text-align: right;
    }

    .summary-row.discount-row {
      display: none;
      color: #8fcb9c;
    }

    .summary-row.discount-row strong { color: #8fcb9c; }

    .divider {
      height: 1px;
      background: #2a3641;
      margin: 8px 0;
    }

    .total {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 16px;
      padding-top: 17px;
    }

    .total span {
      color: #aab2ba;
      font-size: 14px;
      font-weight: 650;
    }

    .total strong {
      color: var(--accent);
      font-size: 27px;
      letter-spacing: -.02em;
    }

    .submit {
      width: 100%;
      height: 48px;
      margin-top: 24px;
      border: 1px solid #ff5966;
      border-radius: 3px;
      background: var(--accent);
      color: white;
      cursor: pointer;
      font-weight: 750;
      letter-spacing: .04em;
      transition: .15s ease;
    }

    .submit:hover { background: var(--accent-dark); }
    .submit:disabled {
      background: #34424f;
      border-color: #3f4e5b;
      color: #87919a;
      cursor: not-allowed;
    }

    .status {
      min-height: 18px;
      margin-top: 12px;
      color: #78848f;
      font-size: 11px;
      text-align: center;
    }

    @media (max-width: 820px) {
      .page { padding: 28px 14px 40px; }
      .content { grid-template-columns: 1fr; }
      .summary { position: static; }
      .fields { grid-template-columns: 1fr; }
      .fields > div:nth-child(3),
      .fields > div:nth-child(4) { grid-column: auto; }
      .products { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 480px) {
      .brand { padding: 0 25px; }
      .brand::before, .brand::after { width: 20px; }
      main.panel, aside.panel { padding: 19px; }
      .products { grid-template-columns: 1fr 1fr; gap: 8px; }
      .product { min-height: 78px; padding: 13px; }
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="container">
      <header>
        <div class="brand">
          <h1>特務幣</h1>
          <p>快速下單系統</p>
        </div>
      </header>

      <div class="content">
        <main class="panel">
          <section class="section">
            <h2 class="section-title">選擇儲值面額</h2>

            <div class="products" id="products"></div>

            <div class="cart-total">
              <div class="cart-total-item">
                <span class="cart-total-label">總數量</span>
                <span class="cart-total-value" id="totalQuantity">0 份</span>
              </div>
              <div class="cart-total-item">
                <span class="cart-total-label">總 VP</span>
                <span class="cart-total-value accent" id="totalVp">0 VP</span>
              </div>
            </div>
          </section>

          <section class="section">
            <h2 class="section-title">帳號資訊</h2>

            <div class="fields">
              <div>
                <label for="riotUsername">Riot 帳號</label>
                <input id="riotUsername" type="text" autocomplete="username">
              </div>

              <div>
                <label for="riotPassword">Riot 密碼</label>
                <input id="riotPassword" type="password" autocomplete="current-password">
                <p class="hint">僅在實際代充流程需要時填寫。</p>
              </div>

              <div>
                <label for="valorantId">特戰 ID</label>
                <input id="valorantId" type="text">
                <p class="hint">格式：名稱#標籤</p>
              </div>

              <div>
                <label for="promoCode">優惠碼 <span style="font-weight:400;color:#6f7780;">（選填）</span></label>
                <div class="promo-row">
                  <input id="promoCode" type="text" autocomplete="off">
                  <button class="secondary" type="button" id="applyPromo">套用</button>
                </div>
                <div class="discount" id="discountMessage"></div>
              </div>
            </div>
          </section>

          <section class="section">
            <h2 class="section-title">聯絡資訊</h2>

            <div class="fields">
              <div>
                <label for="contactName">稱呼</label>
                <input id="contactName" type="text" autocomplete="name">
              </div>

              <div>
                <label for="contactMethod">聯絡方式</label>
                <input id="contactMethod" type="text" placeholder="請填寫聯絡方式">
              </div>

              <div>
                <label for="contactNote">備註 <span style="font-weight:400;color:#6f7780;">（選填）</span></label>
                <input id="contactNote" type="text">
              </div>
            </div>
          </section>
        </main>

        <aside class="panel summary">
          <h2 class="summary-title">訂單摘要</h2>

          <div class="summary-row">
            <span>總 VP</span>
            <strong id="summaryVp">0 VP</strong>
          </div>

          <div class="summary-row">
            <span>原始金額</span>
            <strong id="summaryOriginal">NT$ 0</strong>
          </div>

          <div class="summary-row discount-row" id="discountRow">
            <span>優惠</span>
            <strong id="summaryDiscount">—</strong>
          </div>

          <div class="divider"></div>

          <div class="total">
            <span>應付金額</span>
            <strong id="summaryTotal">NT$ 0</strong>
          </div>

          <button class="submit" id="submitOrder" type="button" disabled>
            確認並下單
          </button>

          <div class="status" id="status"></div>
        </aside>
      </div>
    </div>
  </div>

  <script>
    const products = [
      { vp: 475, price: 150, quantity: 0 },
      { vp: 1000, price: 300, quantity: 0 },
      { vp: 2050, price: 600, quantity: 0 },
      { vp: 3650, price: 1080, quantity: 0 },
      { vp: 5350, price: 1450, quantity: 0 },
      { vp: 11000, price: 2780, quantity: 0 }
    ];

    let discountApplied = false;

    const productsEl = document.getElementById("products");
    const summaryVp = document.getElementById("summaryVp");
    const summaryOriginal = document.getElementById("summaryOriginal");
    const summaryTotal = document.getElementById("summaryTotal");
    const discountRow = document.getElementById("discountRow");
    const summaryDiscount = document.getElementById("summaryDiscount");
    const discountMessage = document.getElementById("discountMessage");
    const submitOrder = document.getElementById("submitOrder");
    const status = document.getElementById("status");
    const totalQuantity = document.getElementById("totalQuantity");
    const totalVp = document.getElementById("totalVp");

    function renderProducts() {
      productsEl.innerHTML = products.map((item, index) => `
        <div class="product ${item.quantity > 0 ? "selected" : ""}">
          <span class="vp">${item.vp.toLocaleString()} VP</span>
          <span class="price">NT$ ${item.price.toLocaleString()}</span>

          <div class="quantity">
            <span class="qty-label">數量</span>
            <div class="qty-controls">
              <button class="qty-btn" type="button" data-index="${index}" data-action="minus">−</button>
              <span class="qty-value">${item.quantity}</span>
              <button class="qty-btn" type="button" data-index="${index}" data-action="plus">+</button>
            </div>
          </div>
        </div>
      `).join("");

      productsEl.querySelectorAll(".qty-btn").forEach(button => {
        button.addEventListener("click", () => {
          const index = Number(button.dataset.index);
          const action = button.dataset.action;

          if (action === "plus") {
            products[index].quantity += 1;
          } else if (action === "minus") {
            products[index].quantity = Math.max(0, products[index].quantity - 1);
          }

          renderProducts();
    updateSummary();
  </script>
</body>
</html>
