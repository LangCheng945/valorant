<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>連成特務幣 | 快速下單系統</title>
  <!-- 載入 Tailwind CSS 快速排版 -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 載入 React 與 ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- 載入 Babel 以便在瀏覽器中編譯 JSX -->
  <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-800">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const App = () => {
      
      const products = [
        { vp: 475, price: 150 },
        { vp: 1000, price: 300 },
        { vp: 2050, price: 600 },
        { vp: 3650, price: 1080 },
        { vp: 5350, price: 1450 },
        { vp: 11000, price: 2780 }
      ];

      const [selectedItem, setSelectedItem] = useState(null);
      const [riotId, setRiotId] = useState("");
      const [promoCode, setPromoCode] = useState("");
      const [discountApplied, setDiscountApplied] = useState(false);
      const [finalPrice, setFinalPrice] = useState(0);

      // 當選擇商品或套用折扣時，重新計算價格
      useEffect(() => {
        if (!selectedItem) {
          setFinalPrice(0);
          return;
        }
        
        let price = selectedItem.price;
        if (discountApplied) {
          if (selectedItem.vp >= 11000) {
            // 大面額固定折抵 50 元 (保護利潤)
            price = price - 50;
          } else {
            // 小面額套用 95 折，並四捨五入
            price = Math.round(price * 0.95);
          }
        }
        setFinalPrice(price);
      }, [selectedItem, discountApplied]);

      // 驗證優惠碼
      const handleApplyPromo = () => {
        if (promoCode.toUpperCase() === "OPEN95") {
          setDiscountApplied(true);
          alert("✅ 優惠碼套用成功！");
        } else {
          setDiscountApplied(false);
          alert("❌ 無效的優惠碼");
        }
      };

      // 模擬送出訂單
      const handleSubmit = (e) => {
        e.preventDefault();
        if (!selectedItem) return alert("請先選擇要儲值的面額！");
        if (!riotId) return alert("請填寫您的 Riot 帳號！");

        const orderData = {
          vp: selectedItem.vp,
          originalPrice: selectedItem.price,
          finalPrice: finalPrice,
          riotId: riotId,
          promoUsed: discountApplied ? promoCode.toUpperCase() : "無"
        };

        // 這裡未來可以替換成 fetch()，把資料傳送到你的 Discord 或 LINE Webhook
        console.log("訂單資料準備送出：", orderData);
        alert(`🎉 訂單已建立！\n商品：${orderData.vp} VP\n應付金額：NT$ ${orderData.finalPrice}\nRiot帳號：${orderData.riotId}\n\n（在真實環境中，這會自動傳送到你的手機通知）`);
      };

      return (
        <div className="max-w-md mx-auto bg-white min-h-screen shadow-lg">
          {/* Header */}
          <header className="bg-orange-500 text-white p-4 text-center sticky top-0 z-10 shadow-md">
            <h1 className="text-xl font-bold">特務幣 | 快速下單系統</h1>
          </header>

          <main className="p-4">
            {/* Step 1: 選擇商品 */}
            <h2 className="text-lg font-bold mb-3 border-b-2 border-orange-200 pb-1">1. 選擇儲值面額</h2>
            <div className="grid grid-cols-2 gap-3 mb-6">
              {products.map((item) => (
                <div 
                  key={item.vp}
                  onClick={() => setSelectedItem(item)}
                  className={`border-2 rounded-lg p-3 cursor-pointer transition-all ${
                    selectedItem?.vp === item.vp 
                      ? 'border-orange-500 bg-orange-50 shadow-md' 
                      : 'border-gray-200 hover:border-orange-300'
                  }`}
                >
                  <div className="text-center font-black text-gray-700 mb-1 flex justify-center items-center gap-1">
                    <img src="https://freelogopng.com/images/all_img/1665507300valorant-points-icon.png" alt="VP" className="w-5 h-5 opacity-80" />
                    {item.vp}
                  </div>
                  <div className="text-center text-sm text-gray-500">特務幣</div>
                  <div className="text-center mt-2 bg-gray-800 text-white rounded text-sm py-1 font-bold">
                    NT$ {item.price}
                  </div>
                </div>
              ))}
            </div>

            {/* Step 2: 填寫資料與折扣 */}
            <h2 className="text-lg font-bold mb-3 border-b-2 border-orange-200 pb-1">2. 填寫帳號與優惠</h2>
            <form onSubmit={handleSubmit} className="space-y-4">
              <div>
                <label className="block text-sm font-bold text-gray-700 mb-1">Riot 帳號 (包含 #標籤)</label>
                <input 
                  type="text" 
                  value={riotId}
                  onChange={(e) => setRiotId(e.target.value)}
                  placeholder="例如：Player123#TWN"
                  className="w-full border border-gray-300 rounded p-2 focus:outline-none focus:border-orange-500"
                />
              </div>

              <div>
                <label className="block text-sm font-bold text-gray-700 mb-1">專屬優惠碼</label>
                <div className="flex gap-2">
                  <input 
                    type="text" 
                    value={promoCode}
                    onChange={(e) => setPromoCode(e.target.value)}
                    placeholder="輸入 OPEN95 享折扣"
                    className="w-full border border-gray-300 rounded p-2 focus:outline-none focus:border-orange-500 uppercase"
                  />
                  <button 
                    type="button" 
                    onClick={handleApplyPromo}
                    className="bg-gray-800 text-white px-4 py-2 rounded hover:bg-gray-700 whitespace-nowrap font-bold"
                  >
                    套用
                  </button>
                </div>
                {discountApplied && (
                  <p className="text-green-600 text-sm mt-1 font-bold">✅ 已套用優惠：{selectedItem?.vp >= 11000 ? '大面額現折 $50' : '全面 95 折'}</p>
                )}
              </div>

              {/* 結帳明細 */}
              <div className="bg-orange-50 border border-orange-200 rounded-lg p-4 mt-6">
                <div className="flex justify-between items-center mb-2">
                  <span className="text-gray-600">已選面額：</span>
                  <span className="font-bold">{selectedItem ? `${selectedItem.vp} VP` : "尚未選擇"}</span>
                </div>
                <div className="flex justify-between items-center mb-2">
                  <span className="text-gray-600">原始金額：</span>
                  <span className={discountApplied ? "line-through text-gray-400" : "font-bold"}>
                    NT$ {selectedItem ? selectedItem.price : 0}
                  </span>
                </div>
                <div className="flex justify-between items-center text-lg font-black text-orange-600 pt-2 border-t border-orange-200">
                  <span>應付總額：</span>
                  <span>NT$ {finalPrice}</span>
                </div>
              </div>

              <button 
                type="submit" 
                className="w-full bg-orange-500 text-white text-lg font-bold py-3 rounded-lg hover:bg-orange-600 shadow-md transition-colors mt-4"
              >
                前往匯款並送出訂單
              </button>
            </form>
          </main>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
